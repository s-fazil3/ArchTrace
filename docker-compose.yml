version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: archtrace-db
    restart: always
    environment:
      MYSQL_DATABASE: esa_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend/backend
    container_name: archtrace-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:mysql://db:3306/esa_db
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: archtrace-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
